[package]
name = "shader-canvas"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

# Nota: se ao rodar `cargo build` o Cargo puxar uma versão mais nova
# de wgpu ou winit que quebre a API usada aqui, veja o comentário
# no topo do main.rs — as APIs de wgpu/winit mudam com frequência.
